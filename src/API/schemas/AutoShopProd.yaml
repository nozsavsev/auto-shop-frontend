openapi: 3.0.4
info:
  title: AutoShopAPI
  version: '1.0'
paths:
  /api/Cars/search:
    get:
      tags:
        - Cars
      parameters:
        - name: TextMatch
          in: query
          schema:
            maxLength: 100
            minLength: 0
            type: string
        - name: Skip
          in: query
          schema:
            maximum: 2147483647
            minimum: 0
            type: integer
            format: int32
        - name: Take
          in: query
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
        - name: HasAtLeastUsers
          in: query
          schema:
            maximum: 2147483647
            minimum: 0
            type: integer
            format: int32
        - name: SortBy
          in: query
          schema:
            $ref: '#/components/schemas/CarSortByNullable'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
  '/api/Cars/{id}':
    get:
      tags:
        - Cars
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CarDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
    put:
      tags:
        - Cars
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CarDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
    delete:
      tags:
        - Cars
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
  /api/Cars:
    post:
      tags:
        - Cars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CarDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
  /api/Status:
    get:
      tags:
        - Status
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
  /api/Users/search:
    get:
      tags:
        - Users
      parameters:
        - name: TextMatch
          in: query
          schema:
            maxLength: 100
            minLength: 0
            type: string
        - name: Skip
          in: query
          schema:
            maximum: 2147483647
            minimum: 0
            type: integer
            format: int32
        - name: Take
          in: query
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
        - name: HasCar
          in: query
          schema:
            type: boolean
        - name: SortBy
          in: query
          schema:
            $ref: '#/components/schemas/UserSortByNullable'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllUsersDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/AllUsersDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/AllUsersDTO'
  '/api/Users/{id}':
    get:
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
    put:
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateUserDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
    delete:
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
  /api/Users:
    post:
      tags:
        - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateUserDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateUserDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
components:
  schemas:
    AllCarsDTO:
      type: object
      properties:
        cars:
          type: array
          items:
            $ref: '#/components/schemas/CarDTO'
          nullable: true
        totalCount:
          type: integer
          format: int64
      additionalProperties: false
    AllUsersDTO:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserDTO'
          nullable: true
        totalCount:
          type: integer
          format: int64
      additionalProperties: false
    CarBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        company:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
      additionalProperties: false
    CarDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        company:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserBasicDTO'
          nullable: true
      additionalProperties: false
    CarSortByNullable:
      enum:
        - CompanyAsc
        - CompanyDesc
        - ModelAsc
        - ModelDesc
        - CreatedAtAsc
        - CreatedAtDesc
        - UpdatedAtAsc
        - UpdatedAtDesc
        - 
      type: string
      nullable: true
    CreateUpdateCarDTO:
      required:
        - company
        - model
      type: object
      properties:
        company:
          maxLength: 100
          minLength: 1
          type: string
        model:
          maxLength: 100
          minLength: 1
          type: string
      additionalProperties: false
    CreateUserDTO:
      required:
        - email
        - name
        - password
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        email:
          maxLength: 100
          minLength: 0
          type: string
          format: email
        password:
          maxLength: 100
          minLength: 6
          type: string
        carId:
          type: integer
          format: int32
          nullable: true
      additionalProperties: false
    UpdateUserDTO:
      required:
        - email
        - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        email:
          maxLength: 100
          minLength: 0
          type: string
          format: email
        password:
          maxLength: 100
          minLength: 6
          type: string
          nullable: true
        carId:
          type: integer
          format: int32
          nullable: true
      additionalProperties: false
    UserBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      additionalProperties: false
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        car:
          $ref: '#/components/schemas/CarBasicDTO'
      additionalProperties: false
    UserSortByNullable:
      enum:
        - NameAsc
        - NameDesc
        - CreatedAtAsc
        - CreatedAtDesc
        - UpdatedAtAsc
        - UpdatedAtDesc
        - 
      type: string
      nullable: true