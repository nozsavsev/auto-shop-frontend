openapi: 3.0.4
info:
  title: AutoShopAPI
  version: '1.0'
paths:
  /api/Cars/search:
    get:
      tags:
        - Cars
      parameters:
        - name: textMatch
          in: query
          schema:
            type: string
        - name: skip
          in: query
          schema:
            type: integer
            format: int32
        - name: take
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
  /api/Cars:
    get:
      tags:
        - Cars
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            format: int32
        - name: take
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
    post:
      tags:
        - Cars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CarDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
  '/api/Cars/{id}':
    get:
      tags:
        - Cars
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CarDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
    put:
      tags:
        - Cars
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateUpdateCarDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CarDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
    delete:
      tags:
        - Cars
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
  /api/Status:
    get:
      tags:
        - Status
      responses:
        '200':
          description: OK
  /api/Users/search:
    get:
      tags:
        - Users
      parameters:
        - name: textMatch
          in: query
          schema:
            type: string
        - name: skip
          in: query
          schema:
            type: integer
            format: int32
        - name: take
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/AllCarsDTO'
  /api/Users:
    get:
      tags:
        - Users
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            format: int32
        - name: take
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllUsersDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/AllUsersDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/AllUsersDTO'
    post:
      tags:
        - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateUserDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateUserDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateUpdateUserDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
  '/api/Users/{id}':
    get:
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
    put:
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateUserDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateUserDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateUpdateUserDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
    delete:
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
components:
  schemas:
    AllCarsDTO:
      type: object
      properties:
        cars:
          type: array
          items:
            $ref: '#/components/schemas/CarDTO'
          nullable: true
        totalCount:
          type: integer
          format: int64
      additionalProperties: false
    AllUsersDTO:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserDTO'
          nullable: true
        totalCount:
          type: integer
          format: int64
      additionalProperties: false
    CarBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        company:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
      additionalProperties: false
    CarDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        company:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserBasicDTO'
          nullable: true
      additionalProperties: false
    CreateUpdateCarDTO:
      type: object
      properties:
        company:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
      additionalProperties: false
    CreateUpdateUserDTO:
      type: object
      properties:
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
        carId:
          type: integer
          format: int32
          nullable: true
      additionalProperties: false
    UserBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      additionalProperties: false
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        car:
          $ref: '#/components/schemas/CarBasicDTO'
      additionalProperties: false